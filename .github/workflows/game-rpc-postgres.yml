name: Game RPC PostgreSQL integration

on:
  pull_request:
    paths:
      - '.github/workflows/game-rpc-postgres.yml'
      - 'supabase/migrations/20261104161355_atomic_move_submission.sql'
      - 'supabase/tests/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-rpc:
    name: Move and timeout RPC (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: chess_simul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chess_simul_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: chess_simul_test
      PGUSER: postgres
      PGPASSWORD: integration_only

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Create isolated schema and existing move trigger
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/sql/atomic_move_fixture.sql

      - name: Apply proposed migration on disposable PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104161355_atomic_move_submission.sql

      - name: Assert privileges, atomic writes, stale replays and timeouts
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/sql/atomic_move_assertions.sql
